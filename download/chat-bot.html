<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anshul Bot | Minimal</title>
    <style>
        :root {
            --bg: #000000;
            --card: #0a0a0a;
            --border: #262626;
            --text-main: #ffffff;
            --bot-bubble: #18181b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background pattern for PC view */
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* AUTO-ADAPTIVE CONTAINER */
        .app-frame {
            width: 100%;
            height: 100%;
            max-width: 420px; /* PC par width itni hi rahegi */
            max-height: 850px; /* PC par height itni hi rahegi */
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        /* Desktop view par rounded corners */
        @media (min-width: 500px) {
            .app-frame {
                border-radius: 30px;
                height: 90vh;
            }
        }

        .header {
            padding: 30px 20px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .bot-logo {
            width: 45px; height: 45px;
            background: white;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: black; font-weight: 800;
        }

        .chat-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
        }
        .chat-view::-webkit-scrollbar { display: none; }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user { align-self: flex-end; background: white; color: black; font-weight: 500; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: var(--bot-bubble); color: white; border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        .input-area {
            padding: 15px;
            display: flex; gap: 8px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }

        .input-area input {
            flex: 1;
            background: #111;
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .send-btn {
            background: white; border: none;
            width: 42px; height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .signature {
            padding: 10px 0 15px;
            text-align: center;
            color: #444;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--card);
        }

        .loader { display: flex; gap: 4px; }
        .dot { width: 4px; height: 4px; background: white; border-radius: 50%; animation: blink 1s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-frame">
    <div class="header">
        <div class="bot-logo">A</div>
        <h2 style="color: white; font-size: 14px; letter-spacing: 1px;">ANSHUL BOT</h2>
    </div>

    <div class="chat-view" id="chat">
        <div class="bubble bot">System Online. Aadesh dein, Anshul Thakur.</div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type here..." autocomplete="off">
        <button class="send-btn" onclick="send()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
    </div>

    <div class="signature">! Made by Anshul Thakur</div>
</div>

<script>
    const KEY = "AIzaSyAN8WFP4ziAz98bMY_7ORdnCIGxcY1TPz8";
    const URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";

    async function send() {
        const input = document.getElementById('msgInput');
        const box = document.getElementById('chat');
        if(!input.value.trim()) return;

        const val = input.value;
        input.value = '';

        const u = document.createElement('div');
        u.className = 'bubble user';
        u.innerText = val;
        box.appendChild(u);

        const l = document.createElement('div');
        l.className = 'bubble bot';
        l.innerHTML = `<div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        box.appendChild(l);
        box.scrollTop = box.scrollHeight;

        try {
            const r = await fetch(`${URL}?key=${KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: val }] }] })
            });
            const d = await r.json();
            l.innerHTML = d.candidates[0].content.parts[0].text;
        } catch(e) { l.innerText = "Error."; }
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
</script>

</body>
  </html>
