<!DOCTYPE html>
<html>
<head>
    <title>MyFiles - Vercel</title>
    <style>
        body { font-family: sans-serif; background: #f6f8fa; padding: 20px; }
        .container { max-width: 600px; margin: auto; border: 1px solid #ddd; background: white; border-radius: 6px; }
        .header { padding: 15px; background: #f6f8fa; border-bottom: 1px solid #ddd; font-weight: bold; }
        .item { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        a { color: #0969da; text-decoration: none; flex-grow: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Assets (Downloads)</div>
        <div id="list">Loading files...</div>
    </div>

    <script>
        fetch('/api/files')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('list');
                if (data.length > 0) {
                    list.innerHTML = data.map(file => `
                        <div class="item">
                            📄 <a href="/myfiles/${file}" download>${file}</a>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = "<p style='padding:15px'>Koi file nahi mili!</p>";
                }
            });
    </script>
</body>
</html>
